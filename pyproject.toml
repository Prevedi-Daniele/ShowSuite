[project]
name = "showsuite"
version = "0.1.0"
description = "ShowSuite: Cue (QLab-like) e Light (Lightkey-like), Windows/Linux"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
